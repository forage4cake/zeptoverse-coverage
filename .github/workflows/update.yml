
name: Update Zeptoverse coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "10 11 * * 2"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install collector dependencies
        run: pip install -r requirements.txt

      - name: Collect and verify mentions
        run: python scripts/collect.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mentions.json

          if ! git diff --cached --quiet; then
            git commit -m "Update verified Zeptoverse mentions"
          fi

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Feed successfully updated."
              exit 0
            fi
            echo "Push attempt $attempt failed. Retrying..."
          done

          echo "Unable to push after three attempts."
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Publish site
        uses: actions/deploy-pages@v5
